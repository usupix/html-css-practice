<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Машинка</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #fff;
    }

    body::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 15vh;
      height: 120px;
      background:
        repeating-linear-gradient(to right, #fff 0 65px, transparent 65px 135px)
        center / 100% 6px no-repeat,
        #555;
    }

    .car {
      position: absolute;
      bottom: calc(15vh + 140px);
      left: -200px;
      width: 200px;
      height: 59px;
      border: 2px solid #ad3554;
      border-radius: 24px 34px 12px 12px;
      background:
        radial-gradient(circle at 96% 30%, #fff3b8 0 7px, transparent 8px),
        radial-gradient(circle at 3% 42%, #ffa58b 0 5px, transparent 6px),
        linear-gradient(155deg, #ff8389, #ee526b 53%, #c83457);
      box-shadow: inset 0 -8px 0 #9f294b, inset 0 2px 0 #ffb2b4;
      animation: drive 4s ease-out forwards;
    }

    .car::before {
      content: "";
      position: absolute;
      bottom: 53px;
      left: 32px;
      width: 130px;
      height: 55px;
      border: 7px solid #e64b61;
      border-bottom: 0;
      border-radius: 55px 67px 0 0 / 42px 44px 0 0;
      background:
        linear-gradient(to right, transparent 46%, #e64b61 46% 54%, transparent 54%),
        linear-gradient(135deg, #e6fbff, #8dccdf 62%, #70afcb);
      transform: skewX(-8deg);
    }

    .car::after {
      content: "";
      position: absolute;
      bottom: -20px;
      left: -2px;
      width: 200px;
      height: 44px;
      background:
        radial-gradient(circle at 41px 22px, #f3f6fa 0 5px, #8290a3 6px 9px, #283347 10px 16px, #151e2e 17px 20px, transparent 21px),
        radial-gradient(circle at 160px 22px, #f3f6fa 0 5px, #8290a3 6px 9px, #283347 10px 16px, #151e2e 17px 20px, transparent 21px);
    }

    @keyframes drive {
      from { left: -200px; }
      to { left: calc(100% - 250px); }
    }
  </style>
</head>
<body>
  <div class="car"></div>
</body>
</html>
