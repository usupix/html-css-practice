<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Машинка шириной 200px, нарисованная на CSS, выезжает слева и останавливается в 50px от правого края.">
  <title>Машинка на CSS</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      /* Небо, облака, солнце и трава — только CSS. */
      background:
        radial-gradient(ellipse 72px 19px at 18% 22%, #fff 98%, transparent 100%),
        radial-gradient(ellipse 59px 18px at 25% 22%, #fff 98%, transparent 100%),
        radial-gradient(ellipse 63px 17px at 59% 34%, #fff 98%, transparent 100%),
        radial-gradient(ellipse 44px 16px at 65% 34%, #fff 98%, transparent 100%),
        radial-gradient(circle 47px at 83% 19%, #ffe7a0 98%, transparent 100%),
        linear-gradient(to bottom, #85cfea 0%, #d5f1f7 63%, #9ed3a5 63%, #73b987 100%);
    }

    /* Дорога — псевдоэлемент body, без дополнительной HTML-разметки. */
    body::before {
      content: "";
      position: absolute;
      right: 0;
      bottom: 14vh;
      left: 0;
      height: 160px;
      border-top: 8px solid #eaf0df;
      border-bottom: 8px solid #657486;
      background:
        repeating-linear-gradient(to right, #f7f0ca 0 70px, transparent 70px 150px)
          center / 100% 7px no-repeat,
        linear-gradient(#47556f, #303c54);
      box-shadow: 0 -9px 0 #8eaf98, 0 12px 0 #aac8a4;
    }

    /* Единственный элемент HTML, рисующий машину. Его ширина ровно 200px. */
    .car {
      position: absolute;
      z-index: 1;
      bottom: calc(14vh + 55px);
      left: -200px;
      width: 200px;
      height: 59px;
      border: 2px solid #ad3554;
      border-radius: 24px 34px 12px 12px;
      background:
        radial-gradient(circle at 96% 30%, #fff3b8 0 7px, transparent 8px),
        radial-gradient(circle at 3% 42%, #ffa58b 0 5px, transparent 6px),
        linear-gradient(to bottom, transparent 60%, #ffc4b2 60% 64%, transparent 64%),
        linear-gradient(155deg, #ff8389, #ee526b 53%, #c83457);
      box-shadow:
        inset 0 -8px 0 #9f294b,
        inset 0 2px 0 #ffb2b4,
        0 15px 20px #19283b38;
      animation: drive 4s cubic-bezier(.2, .75, .28, 1) forwards;
    }

    /* Крыша и два окна. */
    .car::before {
      content: "";
      position: absolute;
      bottom: 53px;
      left: 32px;
      width: 130px;
      height: 55px;
      border: 7px solid #e64b61;
      border-bottom: 0;
      border-radius: 55px 67px 0 0 / 42px 44px 0 0;
      background:
        linear-gradient(to right, transparent 46%, #e64b61 46% 54%, transparent 54%),
        linear-gradient(135deg, #e6fbff, #8dccdf 62%, #70afcb);
      box-shadow: inset 0 3px 0 #ffffff80;
      transform: skewX(-8deg);
    }

    /* Оба колеса в одном псевдоэлементе. */
    .car::after {
      content: "";
      position: absolute;
      bottom: -20px;
      left: -2px;
      width: 200px;
      height: 44px;
      background:
        radial-gradient(circle at 41px 22px,
          #f3f6fa 0 5px, #8290a3 6px 9px, #283347 10px 16px,
          #151e2e 17px 20px, transparent 21px),
        radial-gradient(circle at 160px 22px,
          #f3f6fa 0 5px, #8290a3 6px 9px, #283347 10px 16px,
          #151e2e 17px 20px, transparent 21px);
    }

    @keyframes drive {
      from {
        left: -200px;
      }
      to {
        /* Ширина машины 200px + отступ справа 50px. */
        left: calc(100% - 250px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .car {
        left: calc(100% - 250px);
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="car" role="img" aria-label="Красная машинка на дороге"></div>
</body>
</html>
